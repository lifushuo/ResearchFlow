[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length handled by formatter
]

# The holdout purpose guard is a frozen, byte-hashed protocol.
[tool.ruff.lint.per-file-ignores]
"evals/holdout_usage_guard.py" = ["UP035"]

[tool.ruff.format]
exclude = ["evals/holdout_usage_guard.py"]

[tool.ruff.lint.flake8-bugbear]
# Depends()/Query() in defaults is the FastAPI idiom, not a bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.security.HTTPBearer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
